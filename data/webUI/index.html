    <script>
      // Tsumiru #742: Webtoon continuous reader smooth scrolling distance & controls
      window.addEventListener('keydown', function(e) {
        if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA' || e.ctrlKey || e.metaKey || e.altKey) return;
        if (window.location.href.includes('/chapter/')) {
          var dist = Math.max(140, Math.floor(window.innerHeight * 0.28));
          if (e.key === 'ArrowDown' || e.key === 'j') {
            window.scrollBy({ top: dist, behavior: 'smooth' });
            e.preventDefault();
          } else if (e.key === 'ArrowUp' || e.key === 'k') {
            window.scrollBy({ top: -dist, behavior: 'smooth' });
            e.preventDefault();
          }
        }
      });

    <script>
      // =========================================================================
      // Tsuruyomi Smart Orientation & Reading Mode Controller (Manga vs Webtoon)
      // =========================================================================
      (function() {
        const STORAGE_KEY = 'tsuruyomi_smart_orientation_v1';
        
        function getConfig() {
          try {
            const raw = localStorage.getItem(STORAGE_KEY);
            if (raw) return JSON.parse(raw);
          } catch(e) {}
          return {
            enabled: true,
            mode: 'double_page', // 'double_page' | 'continuous_horizontal' | 'disabled'
            direction: 'auto'    // 'auto' | 'rtl' | 'ltr'
          };
        }

        function setConfig(cfg) {
          try {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(cfg));
          } catch(e) {}
        }

        function isLandscape() {
          if (window.matchMedia && window.matchMedia('(orientation: landscape)').matches) {
            return true;
          }
          if (window.screen && window.screen.orientation && window.screen.orientation.type) {
            return window.screen.orientation.type.startsWith('landscape');
          }
          return window.innerWidth > window.innerHeight;
        }

        function isReaderOpen() {
          return window.location.pathname.includes('/chapter/') ||
                 /\/manga\/\d+\/chapter\//.test(window.location.pathname) ||
                 !!(window.__tsuruyomiReaderStore && window.__tsuruyomiReaderStore.getState().chapters && window.__tsuruyomiReaderStore.getState().chapters.currentChapter);
        }

        function isWebtoonOrManhwa() {
          if (!window.__tsuruyomiReaderStore) return false;
          try {
            const state = window.__tsuruyomiReaderStore.getState();
            const currentMode = state.settings && state.settings.readingMode && state.settings.readingMode.value;
            // 2 = CONTINUOUS_VERTICAL, 4 = WEBTOON
            if (currentMode === 2 || currentMode === 4) return true;
            const manga = state.manga;
            if (manga) {
              if (manga.viewer === 2 || manga.viewer === 4) return true;
              const genres = (manga.genre || []).map(g => (g || '').toLowerCase());
              if (genres.some(g => g.includes('webtoon') || g.includes('manhwa') || g.includes('long strip'))) {
                return true;
              }
            }
          } catch(e) {}
          return false;
        }

        let lastOrientation = isLandscape() ? 'landscape' : 'portrait';
        let debounceTimer = null;

        function showNotification(text, icon) {
          let toast = document.getElementById('tsuruyomi-orient-toast');
          if (!toast) {
            toast = document.createElement('div');
            toast.id = 'tsuruyomi-orient-toast';
            toast.style.cssText = 'position:fixed;top:68px;left:50%;transform:translateX(-50%);background:rgba(20,20,25,0.92);color:#fff;padding:8px 16px;border-radius:24px;font-size:13px;font-weight:600;display:flex;align-items:center;gap:8px;z-index:999999;box-shadow:0 8px 24px rgba(0,0,0,0.5);border:1px solid rgba(255,255,255,0.15);pointer-events:none;transition:opacity 0.25s ease,transform 0.25s ease;opacity:0;backdrop-filter:blur(12px);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;';
            document.body.appendChild(toast);
          }
          toast.innerHTML = (icon ? icon + ' ' : '') + text;
          toast.style.opacity = '1';
          toast.style.transform = 'translateX(-50%) translateY(0)';
          clearTimeout(toast._timer);
          toast._timer = setTimeout(() => {
            toast.style.opacity = '0';
            toast.style.transform = 'translateX(-50%) translateY(-8px)';
          }, 2400);
        }

        function handleOrientationChange() {
          if (!isReaderOpen() || !window.__tsuruyomiReaderService || !window.__tsuruyomiReaderStore) return;
          const config = getConfig();
          if (!config.enabled || config.mode === 'disabled') return;

          const currentOrientation = isLandscape() ? 'landscape' : 'portrait';
          if (currentOrientation === lastOrientation) return;
          lastOrientation = currentOrientation;

          // Si es Webtoon o Manhwa: NO cambiar a horizontal/doble página (mantener vertical para apreciar el arte)
          if (isWebtoonOrManhwa()) {
            if (currentOrientation === 'landscape') {
              showNotification('Webtoon detectado: Cascada vertical activa', '🎨');
            }
            return;
          }

          // Es Manga convencional (páginas individuales)
          const state = window.__tsuruyomiReaderStore.getState();
          const currentMode = state.settings && state.settings.readingMode && state.settings.readingMode.value;

          if (currentOrientation === 'landscape') {
            // Pasar a Horizontal según preferencia
            if (config.mode === 'double_page') {
              if (currentMode !== 1) { // 1 = DOUBLE_PAGE
                window.__tsuruyomiReaderService.updateSetting('readingMode', 1);
                state.settings && state.settings.setSettings && state.settings.setSettings({ readingMode: { isDefault: false, value: 1 } });
                showNotification('Modo Doble Página (Horizontal)', '📖');
              }
              // Comprobar dirección
              if (config.direction === 'rtl' && state.settings && state.settings.readingDirection && state.settings.readingDirection.value !== 1) {
                window.__tsuruyomiReaderService.updateSetting('readingDirection', 1);
                state.settings && state.settings.setSettings && state.settings.setSettings({ readingDirection: { isDefault: false, value: 1 } });
              } else if (config.direction === 'ltr' && state.settings && state.settings.readingDirection && state.settings.readingDirection.value !== 0) {
                window.__tsuruyomiReaderService.updateSetting('readingDirection', 0);
                state.settings && state.settings.setSettings && state.settings.setSettings({ readingDirection: { isDefault: false, value: 0 } });
              }
            } else if (config.mode === 'continuous_horizontal') {
              if (currentMode !== 3) { // 3 = CONTINUOUS_HORIZONTAL
                window.__tsuruyomiReaderService.updateSetting('readingMode', 3);
                state.settings && state.settings.setSettings && state.settings.setSettings({ readingMode: { isDefault: false, value: 3 } });
                showNotification('Horizontal Continuo', '↔️');
              }
            }
          } else {
            // Pasar a Vertical -> SINGLE_PAGE
            if (currentMode === 1 || currentMode === 3) {
              window.__tsuruyomiReaderService.updateSetting('readingMode', 0); // 0 = SINGLE_PAGE
              state.settings && state.settings.setSettings && state.settings.setSettings({ readingMode: { isDefault: false, value: 0 } });
              showNotification('Página Individual (Vertical)', '📄');
            }
          }
        }

        function triggerDebouncedOrientation() {
          clearTimeout(debounceTimer);
          debounceTimer = setTimeout(handleOrientationChange, 150);
        }

        window.addEventListener('resize', triggerDebouncedOrientation);
        window.addEventListener('orientationchange', triggerDebouncedOrientation);
        if (window.matchMedia) {
          window.matchMedia('(orientation: landscape)').addEventListener('change', triggerDebouncedOrientation);
        }
        if (window.screen && window.screen.orientation) {
          window.screen.orientation.addEventListener('change', triggerDebouncedOrientation);
        }

        // =========================================================================
        // UI: Botón flotante y modal de configuración sincronizado con el lector
        // =========================================================================
        function ensureUI() {
          if (!isReaderOpen()) {
            const btn = document.getElementById('tsuruyomi-orient-btn');
            if (btn) btn.style.display = 'none';
            const modal = document.getElementById('tsuruyomi-orient-modal');
            if (modal) modal.style.display = 'none';
            return;
          }

          let btn = document.getElementById('tsuruyomi-orient-btn');
          if (!btn) {
            btn = document.createElement('button');
            btn.id = 'tsuruyomi-orient-btn';
            btn.innerHTML = `
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0;">
                <path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67"/>
              </svg>
              <span style="font-size:12px;font-weight:600;letter-spacing:0.2px;">Auto-Giro</span>
            `;
            btn.style.cssText = 'position:fixed;bottom:84px;right:18px;background:rgba(28,28,34,0.88);color:#fff;padding:8px 14px;border-radius:20px;border:1px solid rgba(255,255,255,0.18);box-shadow:0 6px 20px rgba(0,0,0,0.45);cursor:pointer;display:flex;align-items:center;gap:6px;z-index:99999;backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;transition:opacity 0.2s ease,transform 0.15s ease;user-select:none;-webkit-tap-highlight-color:transparent;';
            
            btn.addEventListener('mouseenter', () => btn.style.transform = 'scale(1.04)');
            btn.addEventListener('mouseleave', () => btn.style.transform = 'scale(1)');
            btn.addEventListener('click', (e) => {
              e.stopPropagation();
              openModal();
            });
            document.body.appendChild(btn);
          }

          // Sincronizar visibilidad con el menú del lector
          if (window.__tsuruyomiReaderStore) {
            try {
              const state = window.__tsuruyomiReaderStore.getState();
              const isVisible = state.overlay?.isVisible !== false;
              btn.style.display = isVisible ? 'flex' : 'none';
            } catch(e) {
              btn.style.display = 'flex';
            }
          } else {
            btn.style.display = 'flex';
          }
        }

        function openModal() {
          let modal = document.getElementById('tsuruyomi-orient-modal');
          if (!modal) {
            modal = document.createElement('div');
            modal.id = 'tsuruyomi-orient-modal';
            modal.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,0.65);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);display:flex;align-items:center;justify-content:center;z-index:1000000;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;padding:16px;box-sizing:border-box;';
            modal.addEventListener('click', (e) => {
              if (e.target === modal) closeModal();
            });
            document.body.appendChild(modal);
          }

          const cfg = getConfig();
          modal.innerHTML = `
            <div style="background:#1b1b22;border:1px solid rgba(255,255,255,0.14);border-radius:18px;max-width:420px;width:100%;box-shadow:0 24px 50px rgba(0,0,0,0.7);padding:24px;color:#f3f4f6;box-sizing:border-box;">
              <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;">
                <div style="display:flex;align-items:center;gap:10px;">
                  <span style="font-size:22px;">🔄</span>
                  <h3 style="margin:0;font-size:17px;font-weight:700;color:#fff;">Rotación Inteligente</h3>
                </div>
                <button id="tsuruyomi-orient-close" style="background:transparent;border:none;color:#9ca3af;font-size:22px;cursor:pointer;padding:4px 8px;border-radius:8px;line-height:1;">✕</button>
              </div>

              <div style="margin-bottom:18px;">
                <label style="display:block;font-size:12px;font-weight:700;text-transform:uppercase;color:#9ca3af;margin-bottom:10px;letter-spacing:0.5px;">Al pasar a Horizontal (Manga):</label>
                <div style="display:flex;flex-direction:column;gap:8px;">
                  <label style="display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:12px;background:${cfg.mode==='double_page'?'rgba(99,102,241,0.2)':'rgba(255,255,255,0.04)'};border:1px solid ${cfg.mode==='double_page'?'#6366f1':'rgba(255,255,255,0.08)'};cursor:pointer;">
                    <input type="radio" name="orient_mode" value="double_page" ${cfg.mode==='double_page'?'checked':''} style="accent-color:#6366f1;transform:scale(1.15);">
                    <div>
                      <div style="font-size:14px;font-weight:600;color:#fff;">📖 Doble Página (Pliego)</div>
                      <div style="font-size:11px;color:#9ca3af;">Muestra 2 páginas enfrentadas como un tomo físico</div>
                    </div>
                  </label>

                  <label style="display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:12px;background:${cfg.mode==='continuous_horizontal'?'rgba(99,102,241,0.2)':'rgba(255,255,255,0.04)'};border:1px solid ${cfg.mode==='continuous_horizontal'?'#6366f1':'rgba(255,255,255,0.08)'};cursor:pointer;">
                    <input type="radio" name="orient_mode" value="continuous_horizontal" ${cfg.mode==='continuous_horizontal'?'checked':''} style="accent-color:#6366f1;transform:scale(1.15);">
                    <div>
                      <div style="font-size:14px;font-weight:600;color:#fff;">↔️ Horizontal Continuo</div>
                      <div style="font-size:11px;color:#9ca3af;">Desplazamiento horizontal fluido entre páginas</div>
                    </div>
                  </label>

                  <label style="display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:12px;background:${cfg.mode==='disabled'?'rgba(99,102,241,0.2)':'rgba(255,255,255,0.04)'};border:1px solid ${cfg.mode==='disabled'?'#6366f1':'rgba(255,255,255,0.08)'};cursor:pointer;">
                    <input type="radio" name="orient_mode" value="disabled" ${cfg.mode==='disabled'?'checked':''} style="accent-color:#6366f1;transform:scale(1.15);">
                    <div>
                      <div style="font-size:14px;font-weight:600;color:#fff;">🚫 Desactivado</div>
                      <div style="font-size:11px;color:#9ca3af;">Mantener modo manual sin rotación automática</div>
                    </div>
                  </label>
                </div>
              </div>

              <div style="margin-bottom:18px;">
                <label style="display:block;font-size:12px;font-weight:700;text-transform:uppercase;color:#9ca3af;margin-bottom:8px;letter-spacing:0.5px;">Sentido de lectura:</label>
                <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;">
                  <button type="button" class="orient-dir-btn" data-dir="auto" style="padding:8px;border-radius:10px;border:1px solid ${cfg.direction==='auto'?'#6366f1':'rgba(255,255,255,0.1)'};background:${cfg.direction==='auto'?'rgba(99,102,241,0.25)':'rgba(255,255,255,0.05)'};color:#fff;font-size:12px;font-weight:600;cursor:pointer;">🔄 Auto</button>
                  <button type="button" class="orient-dir-btn" data-dir="rtl" style="padding:8px;border-radius:10px;border:1px solid ${cfg.direction==='rtl'?'#6366f1':'rgba(255,255,255,0.1)'};background:${cfg.direction==='rtl'?'rgba(99,102,241,0.25)':'rgba(255,255,255,0.05)'};color:#fff;font-size:12px;font-weight:600;cursor:pointer;">⬅️ Der-Izq</button>
                  <button type="button" class="orient-dir-btn" data-dir="ltr" style="padding:8px;border-radius:10px;border:1px solid ${cfg.direction==='ltr'?'#6366f1':'rgba(255,255,255,0.1)'};background:${cfg.direction==='ltr'?'rgba(99,102,241,0.25)':'rgba(255,255,255,0.05)'};color:#fff;font-size:12px;font-weight:600;cursor:pointer;">➡️ Izq-Der</button>
                </div>
              </div>

              <div style="background:rgba(16,185,129,0.12);border:1px solid rgba(16,185,129,0.3);border-radius:12px;padding:12px;margin-bottom:20px;display:flex;gap:10px;align-items:flex-start;">
                <span style="font-size:16px;line-height:1.2;">🎨</span>
                <div style="font-size:12px;line-height:1.45;color:#d1fae5;">
                  <strong>Protección Webtoon & Manhwa activa:</strong> Al leer tiras verticales, el lector se mantendrá siempre en cascada continua al girar para que aprecies los detalles y el arte a pantalla completa sin cortes.
                </div>
              </div>

              <button id="tsuruyomi-orient-save" style="width:100%;background:#6366f1;color:#fff;padding:12px;border:none;border-radius:12px;font-size:14px;font-weight:700;cursor:pointer;box-shadow:0 4px 14px rgba(99,102,241,0.4);transition:background 0.15s ease;">
                Listo
              </button>
            </div>
          `;

          modal.style.display = 'flex';

          modal.querySelectorAll('input[name="orient_mode"]').forEach(radio => {
            radio.addEventListener('change', () => {
              cfg.mode = radio.value;
              setConfig(cfg);
              openModal();
            });
          });

          modal.querySelectorAll('.orient-dir-btn').forEach(btn => {
            btn.addEventListener('click', () => {
              cfg.direction = btn.dataset.dir;
              setConfig(cfg);
              openModal();
            });
          });

          document.getElementById('tsuruyomi-orient-close').onclick = closeModal;
          document.getElementById('tsuruyomi-orient-save').onclick = closeModal;
        }

        function closeModal() {
          const modal = document.getElementById('tsuruyomi-orient-modal');
          if (modal) modal.style.display = 'none';
          handleOrientationChange();
        }

        // Intervalo ligero de sondeo para asegurar que la UI se monte cuando el usuario navegue a /read/
        setInterval(ensureUI, 800);
      })();
    </script>
