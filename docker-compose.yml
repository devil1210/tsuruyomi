services:
  tsuruyomi:
    image: ghcr.io/devil1210/tsuruyomi:latest
    container_name: tsuruyomi
    restart: unless-stopped
    ports:
      - "7654:7654"
    environment:
      - DATABASE_DSN=postgres://devil:suwayomi@192.168.1.150:5432/suwayomi?sslmode=disable
      - SERVER_PORT=7654
      - FLARESOLVERR_ENABLED=true
      - FLARESOLVERR_URL=http://192.168.1.136:8191
      - SIDECAR_ENABLED=true
      - SIDECAR_BASE_URL=http://192.168.1.104:4567
      - TZ=America/Santiago
    volumes:
      - tsuruyomi_config:/config
      - tsuruyomi_data:/data

volumes:
  tsuruyomi_config:
  tsuruyomi_data:
