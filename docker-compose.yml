services:
  tsuruyomi:
    image: ghcr.io/devil1210/tsuruyomi:latest
    container_name: tsuruyomi
    restart: unless-stopped
    ports:
      - "7654:7654"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - DATABASE_DSN=postgres://tsuruyomi:tsuruyomi_pass@postgres:5432/tsuruyomi?sslmode=disable
      - SERVER_PORT=7654
      - SIDECAR_ENABLED=false
      - FLARESOLVERR_ENABLED=false
      - TZ=America/Santiago
    volumes:
      - tsuruyomi_config:/config
      - tsuruyomi_data:/data

  postgres:
    image: postgres:17-alpine
    container_name: tsuruyomi-db
    restart: unless-stopped
    environment:
      - POSTGRES_USER=tsuruyomi
      - POSTGRES_PASSWORD=tsuruyomi_pass
      - POSTGRES_DB=tsuruyomi
    volumes:
      - tsuruyomi_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tsuruyomi -d tsuruyomi"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  tsuruyomi_config:
  tsuruyomi_data:
  tsuruyomi_pgdata:
